<div id="scene_illustrator_settings" class="scene-illustrator-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b data-si-i18n="Scene Illustrator">Scene Illustrator</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label"><input id="si_enabled" type="checkbox"><span data-si-i18n="Enable extension">Enable extension</span></label>
      <label><span data-si-i18n="Analysis model">Analysis model</span>
        <select id="si_analysis_source" class="text_pole">
          <option value="current" data-si-i18n="Current chat model">Current chat model</option>
          <option value="profile">Connection Profile</option>
        </select>
      </label>
      <label id="si_profile_row">Connection Profile
        <select id="si_profile" class="text_pole"><option value="" data-si-i18n="Select a profile">Select a profile</option></select>
      </label>
      <div class="si-setting-grid">
        <label><span data-si-i18n="Default prompt style">Default prompt style</span><select id="si_prompt_style" class="text_pole"><option value="direct" data-si-i18n="Direct description">Direct description</option><option value="booru">Booru tags</option></select></label>
        <label><span data-si-i18n="Candidates per scene">Candidates per scene</span><input id="si_candidate_count" class="text_pole" type="number" min="1" max="8"></label>
        <label><span data-si-i18n="Maximum scenes">Maximum scenes</span><input id="si_max_scenes" class="text_pole" type="number" min="1" max="3"></label>
        <label><span data-si-i18n="Context messages">Context messages</span><input id="si_context_messages" class="text_pole" type="number" min="4" max="200"></label>
      </div>
      <div class="si-button-row">
        <button id="si_manual" class="menu_button"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-si-i18n="Manual mode">Manual mode</span></button>
        <button id="si_character_state" class="menu_button"><i class="fa-solid fa-user-pen"></i> <span data-si-i18n="Character state">Character state</span></button>
        <button id="si_export" class="menu_button"><i class="fa-solid fa-file-export"></i> <span data-si-i18n="Export settings">Export settings</span></button>
        <button id="si_import" class="menu_button"><i class="fa-solid fa-file-import"></i> <span data-si-i18n="Import settings">Import settings</span></button>
        <input id="si_import_file" type="file" accept="application/json" hidden>
      </div>
      <small data-si-i18n="Image generation uses the official Image Generation settings. Configure ComfyUI or another backend in the official panel first.">Image generation uses the official Image Generation settings. Configure ComfyUI or another backend in the official panel first.</small>
    </div>
  </div>
</div>
